<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 현황판</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1 class="main-title">Business Board</h1>
        <div class="header-controls">
            <button class="primary-btn" onclick="addNewColumn()">+ 새 단계 추가</button>
        </div>
    </header>

    <main class="drag-container">
        <ul class="drag-list" id="main-drag-list"></ul>
    </main>

    <section class="archive-section">
        <div class="archive-header" onclick="toggleArchive()">
            <span>📦 보관함 및 완료된 보드 (클릭하여 열기/닫기)</span>
        </div>
        <div class="archive-content" id="archive-content">
            <ul class="drag-list" id="archive-drag-list"></ul>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
